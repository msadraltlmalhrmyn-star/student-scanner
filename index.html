<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport"
        content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">

  <title>ماسح الحضور والتقييم</title>

  <script src="https://cdn.jsdelivr.net/npm/js-aruco2@1.0.0/src/aruco.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/js-aruco2@1.0.0/src/cv.js"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 20px;
      font-family: Arial, sans-serif;
      background: #f4f6f9;
      color: #132238;
      text-align: center;
    }

    h1 {
      color: #174d82;
      font-size: 34px;
      margin: 25px 0 8px;
    }

    .school {
      color: #667085;
      font-size: 19px;
      margin-bottom: 25px;
    }

    .tabs {
      display: flex;
      gap: 10px;
      margin-bottom: 18px;
    }

    .tab {
      flex: 1;
      padding: 17px 5px;
      border: 0;
      border-radius: 18px;
      background: white;
      color: #1671d9;
      font-size: 19px;
      font-weight: bold;
    }

    .tab.active {
      background: #19558e;
      color: white;
    }

    .status {
      background: white;
      border-radius: 18px;
      padding: 17px;
      margin-bottom: 18px;
      font-size: 20px;
      font-weight: bold;
    }

    .cameraBox {
      position: relative;
      width: 100%;
      max-width: 650px;
      margin: auto;
      overflow: hidden;
      border-radius: 24px;
      background: #111;
    }

    video {
      display: block;
      width: 100%;
      min-height: 450px;
      object-fit: cover;
    }

    canvas {
      display: none;
    }

    .frame {
      position: absolute;
      width: 72%;
      height: 65%;
      left: 14%;
      top: 12%;
      border: 5px solid white;
      border-radius: 25px;
      pointer-events: none;
    }

    .guide {
      position: absolute;
      bottom: 20px;
      width: 100%;
      color: white;
      font-size: 20px;
      font-weight: bold;
      text-shadow: 0 2px 6px #000;
    }

    .buttons {
      max-width: 650px;
      margin: 18px auto 0;
    }

    button.main {
      width: 100%;
      border: 0;
      border-radius: 20px;
      padding: 20px;
      margin-bottom: 12px;
      color: white;
      font-size: 22px;
      font-weight: bold;
    }

    #startBtn {
      background: #159447;
    }

    #switchBtn {
      background: #19558e;
    }

    #result {
      max-width: 650px;
      margin: 15px auto;
      padding: 20px;
      border-radius: 20px;
      background: white;
      font-size: 22px;
      min-height: 75px;
    }

    .detected {
      background: #dff7e8 !important;
      border: 2px solid #159447;
    }

    .student {
      font-size: 28px;
      font-weight: bold;
      color: #174d82;
    }

    .answer {
      font-size: 30px;
      font-weight: bold;
      color: #159447;
      margin-top: 8px;
    }
  </style>
</head>

<body>

<h1>📷 ماسح الحضور والتقييم</h1>
<div class="school">مدرسة الحرمين الثانوية</div>

<div class="tabs">
  <button class="tab active" onclick="setMode('attendance',this)">الحضور</button>
  <button class="tab" onclick="setMode('homework',this)">الواجب</button>
  <button class="tab" onclick="setMode('task',this)">مهمة أدائية</button>
</div>

<div class="status" id="cameraStatus">
  اضغط «فتح الكاميرا»
</div>

<div class="cameraBox">

  <video id="video" autoplay playsinline muted></video>

  <div class="frame"></div>

  <div class="guide">
    وجّه الكاميرا نحو بطاقة الطالب
  </div>

</div>

<canvas id="canvas"></canvas>

<div class="buttons">

  <button id="startBtn" class="main" onclick="startCamera()">
    📷 فتح الكاميرا
  </button>

  <button id="switchBtn" class="main" onclick="switchCamera()">
    🔄 تبديل الكاميرا
  </button>

</div>

<div id="result">
  لم يتم مسح أي طالب حتى الآن
</div>

<script>

const video = document.getElementById("video");
const canvas = document.getElementById("canvas");
const ctx = canvas.getContext("2d", {willReadFrequently:true});

let stream = null;
let facingMode = "environment";
let currentMode = "attendance";

let detector = null;

try {
  detector = new AR.Detector();
} catch(e) {
  console.log(e);
}

const students = {
  1: "الوليد",
  2: "محمد",
  3: "علي",
  4: "حسن",
  5: "حسين",
  6: "عبدالله",
  7: "أحمد",
  8: "مهدي",
  9: "يوسف",
  10: "سلمان"
};

function setMode(mode, button) {

  currentMode = mode;

  document.querySelectorAll(".tab")
    .forEach(x => x.classList.remove("active"));

  button.classList.add("active");
}

async function startCamera() {

  try {

    if(stream) {
      stream.getTracks().forEach(track => track.stop());
    }

    stream = await navigator.mediaDevices.getUserMedia({
      video: {
        facingMode: {
          ideal: facingMode
        },
        width: {
          ideal: 1920
        },
        height: {
          ideal: 1080
        }
      },
      audio: false
    });

    video.srcObject = stream;

    await video.play();

    document.getElementById("cameraStatus").innerHTML =
      "✅ الكاميرا تعمل — وجّهها إلى بطاقة الطالب";

    requestAnimationFrame(scan);

  } catch(error) {

    document.getElementById("cameraStatus").innerHTML =
      "❌ تعذر تشغيل الكاميرا: " + error.message;

  }
}

async function switchCamera() {

  facingMode =
    facingMode === "environment"
    ? "user"
    : "environment";

  await startCamera();
}

function scan() {

  if(video.readyState === video.HAVE_ENOUGH_DATA) {

    canvas.width = video.videoWidth;
    canvas.height = video.videoHeight;

    ctx.drawImage(
      video,
      0,
      0,
      canvas.width,
      canvas.height
    );

    try {

      const imageData =
        ctx.getImageData(
          0,
          0,
          canvas.width,
          canvas.height
        );

      if(detector) {

        const markers =
          detector.detect(imageData);

        if(markers.length > 0) {

          handleMarker(markers[0]);

        }

      }

    } catch(e) {

      console.log("SCAN:", e);

    }

  }

  requestAnimationFrame(scan);
}

function handleMarker(marker) {

  const id = marker.id;

  let name =
    students[id] || ("طالب رقم " + id);

  const answer =
    getOrientation(marker.corners);

  const result =
    document.getElementById("result");

  result.classList.add("detected");

  result.innerHTML =
    '<div class="student">' +
    name +
    ' — S' +
    String(id).padStart(2,"0") +
    '</div>' +
    '<div class="answer">الإجابة: ' +
    answer +
    '</div>';

}

function getOrientation(corners) {

  if(!corners || corners.length < 2)
    return "?";

  const p0 = corners[0];
  const p1 = corners[1];

  const dx = p1.x - p0.x;
  const dy = p1.y - p0.y;

  let angle =
    Math.atan2(dy,dx) * 180 / Math.PI;

  if(angle < 0)
    angle += 360;

  if(angle >= 315 || angle < 45)
    return "A";

  if(angle >= 45 && angle < 135)
    return "B";

  if(angle >= 135 && angle < 225)
    return "C";

  return "D";
}

</script>

</body>
</html>
