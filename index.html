<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover">

<title>نظام الحضور والتقييم</title>

<script src="https://cdn.jsdelivr.net/gh/damianofalcioni/js-aruco2@master/src/cv.js"></script>
<script src="https://cdn.jsdelivr.net/gh/damianofalcioni/js-aruco2@master/src/aruco.js"></script>

<style>

*{box-sizing:border-box}

body{
  margin:0;
  padding:16px;
  font-family:Arial,sans-serif;
  background:#f4f6f9;
  color:#14233a;
  text-align:center;
}

h1{
  color:#14558e;
  margin:18px 0 5px;
  font-size:30px;
}

.school{
  color:#667085;
  font-size:18px;
  margin-bottom:18px;
}

.setup{
  max-width:700px;
  margin:auto;
  background:white;
  padding:15px;
  border-radius:20px;
  margin-bottom:15px;
}

label{
  display:block;
  text-align:right;
  font-weight:bold;
  margin:10px 4px 6px;
}

select,input{
  width:100%;
  padding:14px;
  border:2px solid #d0d5dd;
  border-radius:14px;
  font-size:18px;
  background:white;
}

.tabs{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:9px;
  max-width:700px;
  margin:0 auto 15px;
}

.tab{
  border:0;
  padding:15px 5px;
  border-radius:16px;
  background:white;
  color:#1671d9;
  font-size:17px;
  font-weight:bold;
}

.tab.active{
  background:#19558e;
  color:white;
}

#status{
  max-width:700px;
  margin:0 auto 15px;
  background:white;
  border-radius:17px;
  padding:14px;
  font-size:18px;
  font-weight:bold;
}

.cameraBox{
  position:relative;
  max-width:700px;
  margin:auto;
  background:#111;
  overflow:hidden;
  border-radius:22px;
}

video{
  width:100%;
  display:block;
  min-height:400px;
  object-fit:cover;
}

.frame{
  position:absolute;
  width:90%;
  height:76%;
  left:5%;
  top:7%;
  border:4px solid white;
  border-radius:22px;
  pointer-events:none;
}

.guide{
  position:absolute;
  bottom:15px;
  width:100%;
  padding:0 10px;
  color:white;
  font-weight:bold;
  font-size:18px;
  text-shadow:0 2px 6px black;
}

canvas{
  display:none;
}

.buttons{
  max-width:700px;
  margin:15px auto;
}

.main{
  width:100%;
  padding:18px;
  margin-bottom:10px;
  border:0;
  border-radius:18px;
  color:white;
  font-size:20px;
  font-weight:bold;
}

#startBtn{background:#159447}
#switchBtn{background:#19558e}

#nextBtn{
  background:#e58a00;
  display:none;
}

#resetAttendanceBtn{
  background:#b42318;
  display:none;
}

#summary{
  max-width:700px;
  margin:15px auto;
  background:white;
  border-radius:20px;
  padding:18px;
}

.bigNumber{
  font-size:48px;
  color:#159447;
  font-weight:bold;
}

.resultCard{
  border:2px solid #159447;
  background:#e4f7eb;
  border-radius:17px;
  padding:14px;
  margin:9px 0;
}

.studentName{
  font-size:23px;
  font-weight:bold;
  color:#174d82;
}

.studentCode{
  font-weight:bold;
  font-size:19px;
  margin:5px;
}

.answer{
  font-size:28px;
  font-weight:bold;
  color:#159447;
  margin-top:10px;
}

.small{
  color:#667085;
  font-size:15px;
  margin-top:6px;
}

#individualResult{
  display:none;
  max-width:700px;
  margin:15px auto;
  background:#e4f7eb;
  border:3px solid #159447;
  border-radius:20px;
  padding:20px;
}

</style>
</head>

<body>

<h1>📷 الحضور والتقييم</h1>

<div class="school">
مدرسة الحرمين الثانوية
</div>


<div class="setup">

<label>الشعبة</label>

<select id="classSelect">
  <option value="">اختر الشعبة</option>
  <option value="301">301</option>
  <option value="302">302</option>
  <option value="303">303</option>
</select>


<div id="dateArea">

<label>التاريخ</label>

<input
id="attendanceDate"
type="date">

</div>


<div id="numberArea" style="display:none">

<label id="numberLabel">
رقم الواجب
</label>

<input
id="activityNumber"
type="number"
min="1"
placeholder="مثال: 1">

</div>

</div>


<div class="tabs">

<button
class="tab active"
onclick="selectMode('attendance',this)">
👥 الحضور
</button>

<button
class="tab"
onclick="selectMode('homework',this)">
📝 الواجب
</button>

<button
class="tab"
onclick="selectMode('task',this)">
📋 مهمة أدائية
</button>

<button
class="tab"
onclick="selectMode('participation',this)">
⭐ المشاركة
</button>

</div>


<div id="status">
اختر الشعبة ثم افتح الكاميرا
</div>


<div class="cameraBox">

<video
id="video"
autoplay
muted
playsinline>
</video>

<div class="frame"></div>

<div class="guide" id="guide">
الحضور: ضع S01 و S02 داخل الإطار
</div>

</div>


<canvas id="canvas"></canvas>


<div class="buttons">

<button
id="startBtn"
class="main"
onclick="startCamera()">
📷 فتح الكاميرا
</button>

<button
id="switchBtn"
class="main"
onclick="switchCamera()">
🔄 تبديل الكاميرا
</button>

<button
id="nextBtn"
class="main"
onclick="nextStudent()">
➡️ مسح طالب آخر
</button>

<button
id="resetAttendanceBtn"
class="main"
onclick="resetAttendance()">
🗑 بدء مسح حضور جديد
</button>

</div>


<div id="individualResult"></div>


<div id="summary">

<div id="summaryTitle">
لم يبدأ المسح بعد
</div>

<div class="bigNumber" id="attendanceCount">
0
</div>

<div>
عدد الطلاب المسجل حضورهم
</div>

<div id="attendanceList"></div>

</div>


<script>

/* ==================================
   عناصر الكاميرا
================================== */

const video =
document.getElementById("video");

const canvas =
document.getElementById("canvas");

const ctx =
canvas.getContext(
  "2d",
  {willReadFrequently:true}
);

let stream = null;
let detector = null;
let scanning = false;
let facingMode = "environment";
let currentMode = "attendance";


/* ==================================
   بطاقات الاختبار المسموحة فقط
================================== */

const ALLOWED_MARKER_IDS =
new Set([0,1]);


/* ==================================
   الطلاب
================================== */

const students = {

  0:{
    code:"S01",
    name:"اسم الطالب الأول"
  },

  1:{
    code:"S02",
    name:"اسم الطالب الثاني"
  }

};


/* ==================================
   الحضور الجماعي

   لكل بطاقة عداد مستقل.
   لا يشترط اكتشاف البطاقتين
   في نفس إطار الفيديو.
================================== */

let attendanceStudents = {};

let attendanceHits = {
  0:[],
  1:[]
};

/*
  ثلاث قراءات تكفي للاختبار.
  هذا يجعل S02 أسهل في الالتقاط
  مع بقاء فلتر ID 0 و1.
*/
const ATTENDANCE_REQUIRED_HITS = 3;

/*
  نعطي البطاقة 3 ثوانٍ
  لتجميع قراءاتها.
*/
const ATTENDANCE_HIT_WINDOW = 3000;


/* ==================================
   الفردي
================================== */

let individualReadings = [];
let individualLocked = false;

const REQUIRED_READINGS = 5;
const READING_WINDOW = 1500;


/* ==================================
   قارئ ARUCO
================================== */

try{

  detector =
  new AR.Detector();

}
catch(error){

  console.error(error);

}


/* ==================================
   تاريخ اليوم
================================== */

function setToday(){

  const today =
  new Date();

  const year =
  today.getFullYear();

  const month =
  String(
    today.getMonth()+1
  ).padStart(2,"0");

  const day =
  String(
    today.getDate()
  ).padStart(2,"0");

  document
  .getElementById(
    "attendanceDate"
  )
  .value =
  year + "-" + month + "-" + day;

}

setToday();


/* ==================================
   اختيار الوضع
================================== */

function selectMode(mode,button){

  currentMode = mode;

  document
  .querySelectorAll(".tab")
  .forEach(btn => {

    btn.classList.remove("active");

  });

  button.classList.add("active");


  const dateArea =
  document.getElementById("dateArea");

  const numberArea =
  document.getElementById("numberArea");

  const numberLabel =
  document.getElementById("numberLabel");

  const guide =
  document.getElementById("guide");

  const summary =
  document.getElementById("summary");

  const resetButton =
  document.getElementById(
    "resetAttendanceBtn"
  );


  if(mode === "attendance"){

    dateArea.style.display =
    "block";

    numberArea.style.display =
    "none";

    summary.style.display =
    "block";

    guide.innerHTML =
    "الحضور: ضع S01 و S02 داخل الإطار";

    resetButton.style.display =
    stream ? "block" : "none";

  }


  else if(mode === "homework"){

    dateArea.style.display =
    "none";

    numberArea.style.display =
    "block";

    numberLabel.innerHTML =
    "رقم الواجب";

    summary.style.display =
    "none";

    guide.innerHTML =
    "الواجب: امسح بطاقة طالب واحد";

    resetButton.style.display =
    "none";

  }


  else if(mode === "task"){

    dateArea.style.display =
    "none";

    numberArea.style.display =
    "block";

    numberLabel.innerHTML =
    "رقم المهمة الأدائية";

    summary.style.display =
    "none";

    guide.innerHTML =
    "المهمة الأدائية: امسح بطاقة طالب واحد";

    resetButton.style.display =
    "none";

  }


  else{

    dateArea.style.display =
    "block";

    numberArea.style.display =
    "none";

    summary.style.display =
    "none";

    guide.innerHTML =
    "المشاركة: امسح بطاقة طالب واحد";

    resetButton.style.display =
    "none";

  }

  nextStudent();

}


/* ==================================
   التحقق
================================== */

function validateSetup(){

  const className =
  document
  .getElementById(
    "classSelect"
  )
  .value;


  if(!className){

    alert("اختر الشعبة أولاً");

    return false;

  }


  if(
    currentMode === "homework"
    ||
    currentMode === "task"
  ){

    const number =
    document
    .getElementById(
      "activityNumber"
    )
    .value;


    if(!number){

      if(
        currentMode === "homework"
      ){

        alert("أدخل رقم الواجب");

      }

      else{

        alert(
          "أدخل رقم المهمة الأدائية"
        );

      }

      return false;

    }

  }

  return true;

}


/* ==================================
   تشغيل الكاميرا
================================== */

async function startCamera(){

  if(!validateSetup()){
    return;
  }


  const status =
  document.getElementById("status");


  try{

    if(
      !navigator.mediaDevices
      ||
      !navigator.mediaDevices.getUserMedia
    ){

      status.innerHTML =
      "❌ المتصفح لا يدعم الكاميرا";

      return;

    }


    if(stream){

      stream
      .getTracks()
      .forEach(track => track.stop());

    }


    status.innerHTML =
    "جاري تشغيل الكاميرا...";


    stream =
    await navigator
    .mediaDevices
    .getUserMedia({

      video:{

        facingMode:{
          ideal:facingMode
        },

        width:{
          ideal:1920
        },

        height:{
          ideal:1080
        }

      },

      audio:false

    });


    video.srcObject = stream;

    await video.play();


    status.innerHTML =
    "✅ الكاميرا تعمل — وجّهها إلى البطاقات";


    if(
      currentMode === "attendance"
    ){

      document
      .getElementById(
        "resetAttendanceBtn"
      )
      .style.display =
      "block";

    }


    if(!scanning){

      scanning = true;

      requestAnimationFrame(
        scanFrame
      );

    }

  }

  catch(error){

    console.error(error);

    status.innerHTML =
    "❌ تعذر تشغيل الكاميرا: "
    +
    error.name;

  }

}


/* ==================================
   تبديل الكاميرا
================================== */

async function switchCamera(){

  facingMode =
  facingMode === "environment"
  ?
  "user"
  :
  "environment";

  await startCamera();

}


/* ==================================
   المسح

   نستخدم دقة داخلية أعلى من السابق
   للمساعدة في قراءة أكثر من بطاقة.
================================== */

function scanFrame(){

  if(
    video.readyState >= 2
    &&
    detector
  ){

    const scanWidth = 960;

    const ratio =
    video.videoHeight /
    video.videoWidth;

    const scanHeight =
    Math.max(
      1,
      Math.round(
        scanWidth * ratio
      )
    );


    canvas.width =
    scanWidth;

    canvas.height =
    scanHeight;


    ctx.drawImage(
      video,
      0,
      0,
      scanWidth,
      scanHeight
    );


    try{

      const imageData =
      ctx.getImageData(
        0,
        0,
        scanWidth,
        scanHeight
      );


      const detectedMarkers =
      detector.detect(
        imageData
      );


      /*
        لا نسمح بأي ID
        غير 0 و1.
      */

      const validMarkers =
      detectedMarkers.filter(
        marker => {

          const id =
          Number(marker.id);

          return (
            Number.isInteger(id)
            &&
            ALLOWED_MARKER_IDS.has(id)
          );

        }
      );


      if(
        currentMode ===
        "attendance"
      ){

        /*
          نعالج كل بطاقة مستقلة.

          إذا ظهر S01 في هذا الإطار
          وS02 في إطار لاحق،
          كلاهما يجمع قراءاته.
        */

        validMarkers.forEach(
          marker => {

            collectAttendanceHit(
              marker
            );

          }
        );


        /*
          ننظف القراءات القديمة
          حتى لو لم تظهر البطاقة
          في هذا الإطار.
        */

        cleanupAttendanceHits();

      }


      else if(
        validMarkers.length > 0
        &&
        !individualLocked
      ){

        collectIndividual(
          validMarkers[0]
        );

      }

    }

    catch(error){

      console.error(
        "Detection error:",
        error
      );

    }

  }


  requestAnimationFrame(
    scanFrame
  );

}


/* ==================================
   تجميع قراءة حضور
================================== */

function collectAttendanceHit(marker){

  const id =
  Number(marker.id);


  if(
    !ALLOWED_MARKER_IDS.has(id)
  ){

    return;

  }


  if(
    attendanceStudents[id]
  ){

    return;

  }


  if(
    !attendanceHits[id]
  ){

    attendanceHits[id] = [];

  }


  const now =
  Date.now();


  attendanceHits[id].push(now);


  attendanceHits[id] =
  attendanceHits[id].filter(
    time =>
    now - time
    <=
    ATTENDANCE_HIT_WINDOW
  );


  /*
    عرض تقدم القراءة
    حتى نعرف أن الكاميرا
    ترى البطاقة.
  */

  const student =
  students[id];


  document
  .getElementById(
    "status"
  )
  .innerHTML =
  "🔍 "
  +
  student.code
  +
  " — تثبيت القراءة "
  +
  Math.min(
    attendanceHits[id].length,
    ATTENDANCE_REQUIRED_HITS
  )
  +
  "/"
  +
  ATTENDANCE_REQUIRED_HITS;


  if(
    attendanceHits[id].length
    >=
    ATTENDANCE_REQUIRED_HITS
  ){

    confirmAttendance(id);

  }

}


/* ==================================
   اعتماد الحضور
================================== */

function confirmAttendance(id){

  if(
    attendanceStudents[id]
  ){

    return;

  }


  if(
    !ALLOWED_MARKER_IDS.has(id)
  ){

    return;

  }


  const student =
  students[id];


  if(!student){

    return;

  }


  const className =
  document
  .getElementById(
    "classSelect"
  )
  .value;


  const date =
  document
  .getElementById(
    "attendanceDate"
  )
  .value;


  attendanceStudents[id] = {

    id:id,

    code:student.code,

    name:student.name,

    className:className,

    date:date,

    status:"حاضر"

  };


  attendanceHits[id] = [];


  updateAttendanceScreen();


  document
  .getElementById(
    "status"
  )
  .innerHTML =
  "✅ تم تسجيل "
  +
  student.code;

}


/* ==================================
   تنظيف القراءات القديمة
================================== */

function cleanupAttendanceHits(){

  const now =
  Date.now();


  ALLOWED_MARKER_IDS
  .forEach(id => {

    if(
      attendanceStudents[id]
    ){

      return;

    }


    if(
      !attendanceHits[id]
    ){

      attendanceHits[id] = [];

      return;

    }


    attendanceHits[id] =
    attendanceHits[id].filter(
      time =>
      now - time
      <=
      ATTENDANCE_HIT_WINDOW
    );

  });

}


/* ==================================
   تحديث قائمة الحضور
================================== */

function updateAttendanceScreen(){

  const ids =
  Object.keys(
    attendanceStudents
  );


  document
  .getElementById(
    "attendanceCount"
  )
  .textContent =
  ids.length;


  const className =
  document
  .getElementById(
    "classSelect"
  )
  .value;


  const date =
  document
  .getElementById(
    "attendanceDate"
  )
  .value;


  document
  .getElementById(
    "summaryTitle"
  )
  .innerHTML =
  "الشعبة: "
  +
  className
  +
  "<br>"
  +
  "التاريخ: "
  +
  date;


  const list =
  document.getElementById(
    "attendanceList"
  );


  list.innerHTML = "";


  ids
  .sort(
    (a,b) =>
    Number(a) - Number(b)
  )
  .forEach(id => {

    const student =
    attendanceStudents[id];


    const card =
    document.createElement(
      "div"
    );


    card.className =
    "resultCard";


    card.innerHTML =
    '<div class="studentName">'
    +
    student.name
    +
    '</div>'
    +
    '<div class="studentCode">'
    +
    student.code
    +
    ' — حاضر ✅'
    +
    '</div>';


    list.appendChild(card);

  });

}


/* ==================================
   بدء حضور جديد
================================== */

function resetAttendance(){

  if(
    confirm(
      "هل تريد مسح قائمة الحضور الحالية وبدء حضور جديد؟"
    )
  ){

    attendanceStudents = {};

    attendanceHits = {
      0:[],
      1:[]
    };


    updateAttendanceScreen();


    document
    .getElementById(
      "status"
    )
    .innerHTML =
    "جاهز لمسح S01 و S02";

  }

}


/* ==================================
   المسح الفردي
================================== */

function collectIndividual(marker){

  const id =
  Number(marker.id);


  if(
    !ALLOWED_MARKER_IDS.has(id)
  ){

    return;

  }


  const now =
  Date.now();


  const answer =
  getAnswer(
    marker.corners
  );


  individualReadings.push({

    id:id,

    answer:answer,

    time:now

  });


  individualReadings =
  individualReadings.filter(
    reading =>
    now - reading.time
    <=
    READING_WINDOW
  );


  const same =
  individualReadings.filter(
    reading =>
    reading.id === id
  );


  if(
    same.length <
    REQUIRED_READINGS
  ){

    document
    .getElementById(
      "status"
    )
    .innerHTML =
    "🔍 جاري تثبيت "
    +
    students[id].code
    +
    "...";

    return;

  }


  const counts = {
    A:0,
    B:0,
    C:0,
    D:0
  };


  same.forEach(reading => {

    if(
      counts[reading.answer]
      !== undefined
    ){

      counts[
        reading.answer
      ]++;

    }

  });


  let bestAnswer = "A";
  let max = -1;


  Object.keys(counts)
  .forEach(answer => {

    if(
      counts[answer] > max
    ){

      max =
      counts[answer];

      bestAnswer =
      answer;

    }

  });


  showIndividualResult(
    id,
    bestAnswer
  );

}


/* ==================================
   عرض نتيجة الفردي
================================== */

function showIndividualResult(
  id,
  answer
){

  individualLocked = true;


  const student =
  students[id];


  const className =
  document
  .getElementById(
    "classSelect"
  )
  .value;


  const activityNumber =
  document
  .getElementById(
    "activityNumber"
  )
  .value;


  const box =
  document
  .getElementById(
    "individualResult"
  );


  box.style.display =
  "block";


  let title = "";


  if(
    currentMode ===
    "homework"
  ){

    title =
    "📝 الواجب رقم "
    +
    activityNumber;

  }


  else if(
    currentMode ===
    "task"
  ){

    title =
    "📋 المهمة الأدائية رقم "
    +
    activityNumber;

  }


  else{

    title =
    "⭐ المشاركة";

  }


  box.innerHTML =
  '<div class="studentName">'
  +
  student.name

  '</div>'
  +
  '<div class="studentCode">'
  +
  student.code
  +
  '</div>'
  +
  '<div class="small">'
  +
  'الشعبة: '
  +
  className
  +
  '</div>'
  +
  '<div style="margin-top:8px;font-weight:bold">'
  +
  title
  +
  '</div>'
  +

  +

  document

}

/* ==================================
   اتجاه البطاقة
================================== */

function getAnswer(corners){

  if(
    !corners
    ||
    corners.length < 2
  ){

    return "?";

  }


  const p0 =
  corners[0];

  const p1 =
  corners[1];


  const dx =
  p1.x - p0.x;

  const dy =
  p1.y - p0.y;


  let angle =
  Math.atan2(
    dy,
    dx
  )
  *
  180
  /
  Math.PI;


  if(angle < 0){

    angle += 360;

  }


  if(
    angle >= 315
    ||
    angle < 45
  ){

    return "A";

  }


  if(
    angle >= 45
    &&
    angle < 135
  ){

    return "B";

  }


  if(
    angle >= 135
    &&
    angle < 225
  ){

    return "C";

  }


  return "D";

}
