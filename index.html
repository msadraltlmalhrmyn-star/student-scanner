    return "";
  }

  return "S" +
    String(count).padStart(2,"0");
}

function getStudent(id){

  const className =
    document.getElementById(
      "classSelect"
    ).value;

  const list =
    classStudents[className];

  if(
    !list ||
    !Number.isInteger(id) ||
    id < 0 ||
    id >= list.length
  ){
    return null;
  }

  return{
    id:id,

    code:
      "S" +
      String(id+1).padStart(2,"0"),

    name:list[id],

    section:className
  };
}

========================================================= */

const ATTENDANCE_REQUIRED_HITS = 5;
const ATTENDANCE_HIT_WINDOW = 2000;

const MIN_MARKER_AREA = 650;
const MAX_SIDE_RATIO = 2.35;

const SCAN_WIDTH = 1280;


/* =========================================================
   فلتر البطاقة
========================================================= */

function distanceBetween(a,b){

  const dx = a.x-b.x;
  const dy = a.y-b.y;

  return Math.sqrt(
    dx*dx + dy*dy
  );
}


function markerIsGood(marker){

  if(
    !marker ||
    !marker.corners ||
    marker.corners.length !== 4
  ){
    return false;
  }


  const c =
    marker.corners;


  const sides = [
    distanceBetween(c[0],c[1]),
    distanceBetween(c[1],c[2]),
    distanceBetween(c[2],c[3]),
    distanceBetween(c[3],c[0])
  ];


  const minSide =
    Math.min(...sides);


  const maxSide =
    Math.max(...sides);


  if(
    !Number.isFinite(minSide) ||
    !Number.isFinite(maxSide) ||
    minSide <= 0
  ){
    return false;
  }


  if(
    maxSide/minSide >
    MAX_SIDE_RATIO
  ){
    return false;
  }


  let area = 0;


  for(let i=0;i<4;i++){

    const j =
      (i+1)%4;

    area +=
      c[i].x*c[j].y -
      c[j].x*c[i].y;
  }


  area =
    Math.abs(area)/2;


  if(
    !Number.isFinite(area) ||
    area < MIN_MARKER_AREA
  ){
    return false;
  }


  return true;
}

/* =========================================================
   فتح الكاميرا
========================================================= */

async function startCamera(){

  if(!validateSetup()){
    return;
  }


  const status =
    document.getElementById(
      "status"
    );


  try{

    if(
      !navigator.mediaDevices ||
      !navigator.mediaDevices.getUserMedia
    ){

      status.innerHTML =
        "❌ المتصفح لا يدعم الكاميرا";

      return;
    }


    if(stream){

      stream
        .getTracks()
        .forEach(track=>{

          track.stop();

        });
    }


    status.innerHTML =
      "جاري تشغيل الكاميرا...";


    stream =
      await navigator
        .mediaDevices
        .getUserMedia({

          video:{

            facingMode:{
              ideal:facingMode
            },

            width:{
              ideal:1920
            },

            height:{
              ideal:1080
            }

          },

          audio:false
        });


    video.srcObject =
      stream;


    await video.play();


    status.innerHTML =
      "✅ الكاميرا تعمل — وجّهها إلى البطاقات";


    if(
      currentMode ===
      "attendance"
    ){

      document
        .getElementById(
          "resetAttendanceBtn"
        )
        .style.display =
          "block";


      document
        .getElementById(
          "saveAttendanceBtn"
        )
        .style.display =
          "block";
    }


    if(!scanning){

      scanning = true;

      requestAnimationFrame(
        scanFrame
      );
    }

  }

  catch(error){

    console.error(error);


    status.innerHTML =
      "❌ تعذر تشغيل الكاميرا: "
      +
      error.name;
  }
}

/* =========================================================
   المسح المستمر
========================================================= */

function scanFrame(){

  if(
    video.readyState >= 2 &&
    detector &&
    video.videoWidth > 0 &&
    video.videoHeight > 0
  ){

    const scanWidth =
      SCAN_WIDTH;


    const ratio =
      video.videoHeight /
      video.videoWidth;


    const scanHeight =
      Math.max(
        1,
        Math.round(
          scanWidth*ratio
        )
      );


    canvas.width =
      scanWidth;


    canvas.height =
      scanHeight;


    ctx.drawImage(
      video,
      0,
      0,
      scanWidth,
      scanHeight
    );


    try{

      const imageData =
        ctx.getImageData(
          0,
          0,
          scanWidth,
          scanHeight
        );


      const detectedMarkers =
        detector.detect(
          imageData
        );


      const validMarkers =
        detectedMarkers.filter(
          marker=>{

            const id =
              Number(marker.id);


            return(
              Number.isInteger(id)
              &&
              ALLOWED_MARKER_IDS.has(id)
              &&
              getStudent(id)
              &&
              markerIsGood(marker)
            );

          }
        );


      if(
        currentMode ===
        "attendance"
      ){

        validMarkers
          .forEach(marker=>{

            collectAttendanceHit(
              marker
            );

          });


        cleanupAttendanceHits();
      }


      else if(
        validMarkers.length > 0
        &&
        !individualLocked
      ){

        collectIndividual(
          validMarkers[0]
        );
      }

    }

    catch(error){

      console.error(
        "Detection error:",
        error
      );
    }
  }


  requestAnimationFrame(
    scanFrame
  );
}


/* =========================================================
   تجميع قراءات الحضور
========================================================= */

function collectAttendanceHit(marker){

  const id =
    Number(marker.id);


  if(
    !ALLOWED_MARKER_IDS.has(id)
  ){
    return;
  }


  const student =
    getStudent(id);


  if(!student){
    return;
  }


  if(
    attendanceStudents[id]
  ){
    return;
  }


  if(
    !attendanceHits[id]
  ){
    attendanceHits[id] = [];
  }


  const now =
    Date.now();


  attendanceHits[id]
    .push(now);


  attendanceHits[id] =
    attendanceHits[id]
      .filter(
        time=>
          now-time
          <=
          ATTENDANCE_HIT_WINDOW
      );


  document
    .getElementById(
      "status"
    )
    .innerHTML =
      "🔍 "
      +
      student.code
      +
      " "
      +
      student.name
      +
      " — "
      +
      Math.min(
        attendanceHits[id].length,
        ATTENDANCE_REQUIRED_HITS
      )
      +
      "/"
      +
      ATTENDANCE_REQUIRED_HITS;


  if(
    attendanceHits[id].length
    >=
    ATTENDANCE_REQUIRED_HITS
  ){

    confirmAttendance(id);
  }
}


/* =========================================================

   + تسجيله فوراً في Google Sheets
========================================================= */

function confirmAttendance(id){

  if(

  ){
    return;
  }


  const student =
    getStudent(id);


  if(!student){
    return;
  }


  const className =
    document

        "classSelect"
      )
      .value;


  const date =
    document
      .getElementById(
        "attendanceDate"
      )
      .value;


  if(
    !className ||
    !date

    return;
  }


  // أولاً: اعتماده حاضر محلياً
  // حتى لا تتكرر البطاقة أثناء الإرسال.

  attendanceStudents[id] = {

    id:id,

    code:student.code,

    name:student.name,

    className:className,

    date:date,

    status:"حاضر"

    .innerHTML =
      "✅ "
      +
      student.name
      +
      " — حاضر — جاري التسجيل...";


  // ثانياً: تسجيله فوراً في Google Sheets.

  const payload = {

    type:"attendanceLive",

    section:className,

    date:date,

    student:{

      id:student.id,

      code:student.code,

      name:student.name

    }

  };


  sendToServer(payload)

    .then(function(){

      document
        .getElementById(
          "status"
        )
        .innerHTML =
          "🟢 "
          +
          student.name
          +
          " — حاضر";

        .getElementById(
          "status"
        )
        .innerHTML =
          "⚠️ "
          +
          student.name

          " ظهر حاضر — تحقق من سجل الحضور";

    });

/* =========================================================

function cleanupAttendanceHits(){

  const now =
    Date.now();


  ALLOWED_MARKER_IDS
    .forEach(id=>{

      if(
        attendanceStudents[id]
      ){
        return;

      if(
        !attendanceHits[id]
      ){

        attendanceHits[id] = [];

      attendanceHits[id] =
        attendanceHits[id]
          .filter(
            time=>
              now-time
              <=
              ATTENDANCE_HIT_WINDOW
          );

    });
}

/* =========================================================
   القراءة الفردية
========================================================= */

function collectIndividual(marker){

  const id =
    Number(marker.id);


  if(
    !ALLOWED_MARKER_IDS.has(id)
  ){
    return;
  }


  const student =
    getStudent(id);


  if(!student){
    return;
  }


  const now =
    Date.now();


  const answer =
    getAnswer(
      marker.corners
    );


  individualReadings.push({

    id:id,

    answer:answer,

    time:now

  });


  individualReadings =
    individualReadings
      .filter(
        reading=>
          now-reading.time
          <=
          READING_WINDOW
      );


  const same =
    individualReadings
      .filter(
        reading=>
          reading.id === id
      );


  if(
    same.length <
    REQUIRED_READINGS
  ){

    document
      .getElementById(
        "status"
      )
      .innerHTML =
        "🔍 جاري تثبيت "
        +
        student.name
        +
        "...";


    return;
  }


  const counts = {

    A:0,

    B:0,

    C:0,

    D:0

  };


  same.forEach(reading=>{

    if(
      counts[
        reading.answer
      ] !== undefined
    ){

      counts[
        reading.answer
      ]++;

    }

  });


  let bestAnswer = "A";

  let max = -1;


  Object.keys(counts)
    .forEach(answer=>{

      if(
        counts[answer] > max
      ){

        max =
          counts[answer];


        bestAnswer =
          answer;
      }

    });


  showIndividualResult(
    id,
    bestAnswer
  );
}

/* =========================================================
   اتجاه البطاقة
========================================================= */

function getAnswer(corners){

  if(
    !corners ||
    corners.length < 2
  ){
    return "?";
  }


  const p0 =
    corners[0];


  const p1 =
    corners[1];


  const dx =
    p1.x-p0.x;


  const dy =
    p1.y-p0.y;


  let angle =
    Math.atan2(
      dy,
      dx
    )
    *
    180
    /
    Math.PI;


  if(angle < 0){

    angle += 360;
  }


  if(
    angle >= 315 ||
    angle < 45
  ){

    return "A";
  }


  if(
    angle >= 45 &&
    angle < 135
  ){

    return "D";
  }


  if(
    angle >= 135 &&
    angle < 225
  ){

    return "C";
  }


  return "B";
}
