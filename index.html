<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover">

<title>ماسح الحضور والتقييم</title>

<script src="https://cdn.jsdelivr.net/gh/damianofalcioni/js-aruco2@master/src/cv.js"></script>
<script src="https://cdn.jsdelivr.net/gh/damianofalcioni/js-aruco2@master/src/aruco.js"></script>

<style>
*{box-sizing:border-box}

body{
 margin:0;
 padding:20px;
 font-family:Arial,sans-serif;
 background:#f4f6f9;
 color:#14233a;
 text-align:center;
}

h1{
 color:#14558e;
 font-size:34px;
 margin:25px 0 8px;
}

.school{
 color:#667085;
 font-size:19px;
 margin-bottom:25px;
}

.tabs{
 display:flex;
 gap:10px;
 margin-bottom:18px;
}

.tab{
 flex:1;
 padding:17px 5px;
 border:0;
 border-radius:18px;
 background:white;
 color:#1671d9;
 font-size:19px;
 font-weight:bold;
}

.tab.active{
 background:#19558e;
 color:white;
}

#status{
 background:white;
 border-radius:18px;
 padding:17px;
 margin-bottom:18px;
 font-size:19px;
 font-weight:bold;
}

.cameraBox{
 position:relative;
 width:100%;
 max-width:650px;
 margin:auto;
 overflow:hidden;
 border-radius:24px;
 background:#111;
}

video{
 display:block;
 width:100%;
 min-height:450px;
 object-fit:cover;
}

.frame{
 position:absolute;
 width:70%;
 height:65%;
 left:15%;
 top:12%;
 border:5px solid white;
 border-radius:25px;
 pointer-events:none;
}

.guide{
 position:absolute;
 bottom:18px;
 width:100%;
 color:white;
 font-size:20px;
 font-weight:bold;
 text-shadow:0 2px 6px black;
}

canvas{
 display:none;
}

.buttons{
 max-width:650px;
 margin:18px auto;
}

.main{
 width:100%;
 border:0;
 border-radius:20px;
 padding:20px;
 margin-bottom:12px;
 color:white;
 font-size:22px;
 font-weight:bold;
}

#startBtn{background:#159447}
#switchBtn{background:#19558e}

#result{
 max-width:650px;
 margin:15px auto;
 padding:20px;
 border-radius:20px;
 background:white;
 font-size:22px;
 min-height:90px;
}

.success{
 background:#ddf7e7 !important;
 border:3px solid #159447;
}

.student{
 font-size:30px;
 font-weight:bold;
 color:#174d82;
}

.answer{
 font-size:34px;
 font-weight:bold;
 color:#159447;
 margin-top:8px;
}
</style>
</head>

<body>

<h1>📷 ماسح الحضور والتقييم</h1>

<div class="school">
مدرسة الحرمين الثانوية
</div>

<div class="tabs">
<button class="tab active"
 onclick="selectMode('attendance',this)">
الحضور
</button>

<button class="tab"
 onclick="selectMode('homework',this)">
الواجب
</button>

<button class="tab"
 onclick="selectMode('task',this)">
مهمة أدائية
</button>
</div>

<div id="status">
اضغط فتح الكاميرا
</div>

<div class="cameraBox">

<video id="video"
 autoplay
 muted
 playsinline></video>

<div class="frame"></div>

<div class="guide">
وجّه الكاميرا نحو بطاقة الطالب
</div>

</div>

<canvas id="canvas"></canvas>

<div class="buttons">

<button
 id="startBtn"
 class="main"
 onclick="startCamera()">
📷 فتح الكاميرا
</button>

<button
 id="switchBtn"
 class="main"
 onclick="switchCamera()">
🔄 تبديل الكاميرا
</button>

</div>

<div id="result">
لم يتم مسح أي طالب حتى الآن
</div>


<script>

const video =
 document.getElementById("video");

const canvas =
 document.getElementById("canvas");

const ctx =
 canvas.getContext(
  "2d",
  {willReadFrequently:true}
 );

let stream = null;

let facingMode =
 "environment";

let currentMode =
 "attendance";

let scanning =
 false;


/* ==============================
   ARUCO DETECTOR
================================ */

let detector;

try{

 detector =
  new AR.Detector({
   dictionaryName:
   "ARUCO_MIP_36h12"
  });

}catch(error){

 console.error(error);

 document.getElementById("status")
 .innerHTML =
 "❌ لم يتم تحميل قارئ البطاقات";

}


/* ==============================
   الطلاب
================================ */

const students = {

 0:"الطالب S01",
 1:"الطالب S02",
 2:"الطالب S03",
 3:"الطالب S04",
 4:"الطالب S05"

};


/* ==============================
   اختيار الوضع
================================ */

function selectMode(mode,button){

 currentMode = mode;

 document
 .querySelectorAll(".tab")
 .forEach(btn =>
  btn.classList.remove("active")
 );

 button.classList.add("active");

}


/* ==============================
   تشغيل الكاميرا
================================ */

async function startCamera(){

 const status =
  document.getElementById("status");

 try{

  if(stream){

   stream
   .getTracks()
   .forEach(track =>
    track.stop()
   );

  }

  status.innerHTML =
   "جاري تشغيل الكاميرا...";

  stream =
   await navigator
   .mediaDevices
   .getUserMedia({

    video:{

     facingMode:{
      ideal:facingMode
     },

     width:{
      ideal:1280
     },

     height:{
      ideal:720
     }

    },

    audio:false

   });

  video.srcObject =
   stream;

  await video.play();

  status.innerHTML =
   "✅ الكاميرا تعمل — وجّهها إلى بطاقة الطالب";

  if(!scanning){

   scanning = true;

   requestAnimationFrame(scan);

  }

 }catch(error){

  console.error(error);

  status.innerHTML =
   "❌ تعذر تشغيل الكاميرا: "
   + error.name;

 }

}


/* ==============================
   تبديل الكاميرا
================================ */

async function switchCamera(){

 facingMode =
  facingMode === "environment"
  ? "user"
  : "environment";

 await startCamera();

}


/* ==============================
   المسح المستمر
================================ */

function scan(){

 if(
  video.readyState >= 2 &&
  detector
 ){

  /*
   تقليل الدقة هنا متعمد
   حتى يكون المسح سريعاً على الآيفون
  */

  const scanWidth =
   640;

  const ratio =
   video.videoHeight /
   video.videoWidth;

  const scanHeight =
   Math.round(
    scanWidth * ratio
   );

  canvas.width =
   scanWidth;

  canvas.height =
   scanHeight;

  ctx.drawImage(
   video,
   0,
   0,
   scanWidth,
   scanHeight
  );

  try{

   const imageData =
    ctx.getImageData(
     0,
     0,
     scanWidth,
     scanHeight
    );

   const markers =
    detector.detect(
     imageData
    );

   if(markers.length > 0){

    handleMarker(
     markers[0]
    );

   }

  }catch(error){

   console.error(
    "Detection error:",
    error
   );

  }

 }

 requestAnimationFrame(scan);

}


/* ==============================
   عند اكتشاف البطاقة
================================ */

function handleMarker(marker){

 const id =
  Number(marker.id);

 const studentNumber =
  id + 1;

 const name =
  students[id] ||
  ("الطالب S" +
   String(studentNumber)
   .padStart(2,"0"));

 const answer =
  getAnswer(
   marker.corners
  );

 const result =
  document.getElementById(
   "result"
  );

 result.classList.add(
  "success"
 );

 let modeText = "";

 if(currentMode ===
    "attendance"){

  modeText =
   "✅ حاضر";

 }else if(
  currentMode ===
  "homework"){

  modeText =
   "الواجب";

 }else{

  modeText =
   "المهمة الأدائية";

 }

 result.innerHTML =

  '<div class="student">' +
  name +
  '</div>' +

  '<div>' +
  modeText +
  '</div>' +

  '<div class="answer">' +
  'الإجابة: ' +
  answer +
  '</div>';

}


/* ==============================
   تحديد اتجاه البطاقة
   A B C D
================================ */

function getAnswer(corners){

 if(
  !corners ||
  corners.length < 2
 ){

  return "?";

 }

 const p0 =
  corners[0];

 const p1 =
  corners[1];

 const dx =
  p1.x - p0.x;

 const dy =
  p1.y - p0.y;

 let angle =
  Math.atan2(
   dy,
   dx
  ) *
  180 /
  Math.PI;

 if(angle < 0){

  angle += 360;

 }

 /*
   أعلى البطاقة = A
   يمين = B
   أسفل = C
   يسار = D
 */

 if(
  angle >= 315 ||
  angle < 45
 ){

  return "A";

 }

 if(
  angle >= 45 &&
  angle < 135
 ){

  return "B";

 }

 if(
  angle >= 135 &&
  angle < 225
 ){

  return "C";

 }

 return "D";

}


/* ==============================
   فحص تحميل المكتبة
================================ */

window.addEventListener(
 "load",
 function(){

  if(
   typeof AR ===
   "undefined"
  ){

   document
   .getElementById("status")
   .innerHTML =
   "❌ مكتبة قراءة البطاقات لم تُحمّل";

  }

 }
);

</script>

</body>
</html>
