<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">

<title>ماسح الحضور والتقييم</title>

<script src="https://cdn.jsdelivr.net/gh/damianofalcioni/js-aruco2@master/src/cv.js"></script>
<script src="https://cdn.jsdelivr.net/gh/damianofalcioni/js-aruco2@master/src/aruco.js"></script>

<style>

*{
  box-sizing:border-box;
}

body{
  margin:0;
  padding:20px;
  font-family:Arial,sans-serif;
  background:#f4f6f9;
  color:#14233a;
  text-align:center;
}

h1{
  color:#14558e;
  font-size:32px;
  margin:20px 0 8px;
}

.school{
  color:#667085;
  font-size:19px;
  margin-bottom:22px;
}

.tabs{
  display:flex;
  gap:10px;
  margin-bottom:18px;
}

.tab{
  flex:1;
  padding:17px 4px;
  border:0;
  border-radius:18px;
  background:white;
  color:#1671d9;
  font-size:18px;
  font-weight:bold;
}

.tab.active{
  background:#19558e;
  color:white;
}

#status{
  background:white;
  border-radius:18px;
  padding:16px;
  margin-bottom:18px;
  font-size:19px;
  font-weight:bold;
}

.cameraBox{
  position:relative;
  width:100%;
  max-width:650px;
  margin:auto;
  overflow:hidden;
  border-radius:24px;
  background:#111;
}

video{
  display:block;
  width:100%;
  min-height:430px;
  object-fit:cover;
}

.frame{
  position:absolute;
  width:72%;
  height:65%;
  left:14%;
  top:12%;
  border:5px solid white;
  border-radius:25px;
  pointer-events:none;
}

.guide{
  position:absolute;
  bottom:18px;
  width:100%;
  color:white;
  font-size:19px;
  font-weight:bold;
  text-shadow:0 2px 6px #000;
}

canvas{
  display:none;
}

.buttons{
  max-width:650px;
  margin:18px auto;
}

.main{
  width:100%;
  border:0;
  border-radius:20px;
  padding:19px;
  margin-bottom:12px;
  color:white;
  font-size:21px;
  font-weight:bold;
}

#startBtn{
  background:#159447;
}

#switchBtn{
  background:#19558e;
}

#unlockBtn{
  background:#e58a00;
  display:none;
}

#result{
  max-width:650px;
  margin:15px auto;
  padding:20px;
  border-radius:20px;
  background:white;
  min-height:110px;
}

.success{
  background:#ddf7e7 !important;
  border:3px solid #159447;
}

.studentName{
  font-size:29px;
  font-weight:bold;
  color:#174d82;
}

.studentCode{
  font-size:22px;
  font-weight:bold;
  margin-top:5px;
}

.answer{
  font-size:34px;
  font-weight:bold;
  color:#159447;
  margin-top:10px;
}

.hint{
  color:#667085;
  font-size:16px;
  margin-top:8px;
}

</style>
</head>

<body>

<h1>📷 ماسح الحضور والتقييم</h1>

<div class="school">
مدرسة الحرمين الثانوية
</div>


<div class="tabs">

<button class="tab active"
onclick="selectMode('attendance',this)">
الحضور
</button>

<button class="tab"
onclick="selectMode('homework',this)">
الواجب
</button>

<button class="tab"
onclick="selectMode('task',this)">
مهمة أدائية
</button>

</div>


<div id="status">
جاهز — اضغط «فتح الكاميرا»
</div>


<div class="cameraBox">

<video
id="video"
autoplay
muted
playsinline>
</video>

<div class="frame"></div>

<div class="guide">
وجّه الكاميرا نحو بطاقة الطالب
</div>

</div>


<canvas id="canvas"></canvas>


<div class="buttons">

<button
id="startBtn"
class="main"
onclick="startCamera()">
📷 فتح الكاميرا
</button>

<button
id="switchBtn"
class="main"
onclick="switchCamera()">
🔄 تبديل الكاميرا
</button>

<button
id="unlockBtn"
class="main"
onclick="unlockResult()">
🔓 مسح بطاقة أخرى
</button>

</div>


<div id="result">
لم يتم مسح أي طالب حتى الآن
</div>


<script>

/* =====================================
   العناصر
===================================== */

const video =
document.getElementById("video");

const canvas =
document.getElementById("canvas");

const ctx =
canvas.getContext(
  "2d",
  {willReadFrequently:true}
);


/* =====================================
   المتغيرات
===================================== */

let stream = null;

let facingMode =
"environment";

let currentMode =
"attendance";

let scanning =
false;

let detector = null;


/*
  عندما يتم تثبيت طالب
  تصبح هذه true
*/
let resultLocked =
false;


/*
  نجمع عدة قراءات قبل الاعتماد
*/
let readings = [];


/*
  آخر وقت ظهرت فيه علامة
*/
let lastSeenTime = 0;


/*
  عدد القراءات المطلوبة للتثبيت
*/
const REQUIRED_READINGS = 7;


/*
  المدة التي نجمع خلالها القراءات
*/
const READING_WINDOW = 1200;


/* =====================================
   قارئ ArUco
===================================== */

try{

  detector =
  new AR.Detector();

}catch(error){

  console.error(error);

}


/* =====================================
   أسماء الطلاب

   مهم:
   ID 0 = S01
   ID 1 = S02
   وهكذا

   غيّر "اسم الطالب الأول"
   لاحقاً إلى الاسم الحقيقي.
===================================== */

const students = {

  0:{
    code:"S01",
    name:"اسم الطالب الأول"
  },

  1:{
    code:"S02",
    name:"اسم الطالب الثاني"
  },

  2:{
    code:"S03",
    name:"اسم الطالب الثالث"
  },

  3:{
    code:"S04",
    name:"اسم الطالب الرابع"
  },

  4:{
    code:"S05",
    name:"اسم الطالب الخامس"
  }

};


/* =====================================
   اختيار الوضع
===================================== */

function selectMode(
  mode,
  button
){

  currentMode =
  mode;

  document
  .querySelectorAll(".tab")
  .forEach(btn => {

    btn.classList.remove(
      "active"
    );

  });

  button.classList.add(
    "active"
  );


  /*
    عند تغيير نوع التقييم
    نسمح بقراءة جديدة
  */

  unlockResult();

}


/* =====================================
   تشغيل الكاميرا
===================================== */

async function startCamera(){

  const status =
  document.getElementById(
    "status"
  );

  try{

    if(
      !navigator.mediaDevices ||
      !navigator.mediaDevices.getUserMedia
    ){

      status.innerHTML =
      "❌ المتصفح لا يدعم الكاميرا";

      return;

    }


    if(stream){

      stream
      .getTracks()
      .forEach(track => {

        track.stop();

      });

    }


    status.innerHTML =
    "جاري تشغيل الكاميرا...";


    stream =
    await navigator
    .mediaDevices
    .getUserMedia({

      video:{

        facingMode:{
          ideal:facingMode
        },

        width:{
          ideal:1280
        },

        height:{
          ideal:720
        }

      },

      audio:false

    });


    video.srcObject =
    stream;


    await video.play();


    status.innerHTML =
    "✅ الكاميرا تعمل — وجّهها إلى بطاقة الطالب";


    if(!scanning){

      scanning = true;

      requestAnimationFrame(
        scanFrame
      );

    }

  }
  catch(error){

    console.error(error);

    status.innerHTML =
    "❌ تعذر تشغيل الكاميرا: "
    +
    error.name;

  }

}


/* =====================================
   تبديل الكاميرا
===================================== */

async function switchCamera(){

  facingMode =
  facingMode === "environment"
  ?
  "user"
  :
  "environment";


  await startCamera();

}


/* =====================================
   المسح المستمر
===================================== */

function scanFrame(){

  /*
    إذا ثبتنا النتيجة
    لا نغيرها.
  */

  if(resultLocked){

    requestAnimationFrame(
      scanFrame
    );

    return;

  }


  if(
    video.readyState >= 2 &&
    detector
  ){

    const scanWidth =
    640;


    const ratio =
    video.videoHeight /
    video.videoWidth;


    const scanHeight =
    Math.max(
      1,
      Math.round(
        scanWidth * ratio
      )
    );


    canvas.width =
    scanWidth;

    canvas.height =
    scanHeight;


    ctx.drawImage(
      video,
      0,
      0,
      scanWidth,
      scanHeight
    );


    try{

      const imageData =
      ctx.getImageData(
        0,
        0,
        scanWidth,
        scanHeight
      );


      const markers =
      detector.detect(
        imageData
      );


      if(
        markers &&
        markers.length > 0
      ){

        lastSeenTime =
        Date.now();


        collectReading(
          markers[0]
        );

      }

    }
    catch(error){

      console.error(
        "Detection:",
        error
      );

    }

  }


  requestAnimationFrame(
    scanFrame
  );

}


/* =====================================
   جمع القراءات
===================================== */

function collectReading(
  marker
){

  const id =
  Number(
    marker.id
  );


  const answer =
  getAnswerFromOrientation(
    marker.corners
  );


  const now =
  Date.now();


  readings.push({

    id:id,

    answer:answer,

    time:now

  });


  /*
    نحذف القراءات القديمة
  */

  readings =
  readings.filter(
    item =>
    now - item.time
    <=
    READING_WINDOW
  );


  /*
    نحسب أكثر ID ظهوراً
  */

  const idCounts = {};


  readings.forEach(
    item => {

      if(
        idCounts[item.id] ===
        undefined
      ){

        idCounts[item.id] = 0;

      }

      idCounts[item.id]++;

    }
  );


  let bestID = null;

  let bestIDCount = 0;


  Object.keys(
    idCounts
  )
  .forEach(key => {

    if(
      idCounts[key] >
      bestIDCount
    ){

      bestID =
      Number(key);

      bestIDCount =
      idCounts[key];

    }

  });


  /*
    لا نعتمد الطالب إلا بعد
    عدة قراءات متوافقة
  */

  if(
    bestIDCount <
    REQUIRED_READINGS
  ){

    document
    .getElementById(
      "status"
    )
    .innerHTML =
    "🔍 جاري تثبيت قراءة البطاقة...";

    return;

  }


  /*
    الآن نأخذ قراءات
    نفس الطالب فقط
  */

  const studentReadings =
  readings.filter(
    item =>
    item.id === bestID
  );


  /*
    نحدد أكثر اتجاه
    تكرر لهذا الطالب
  */

  const answerCounts = {

    A:0,
    B:0,
    C:0,
    D:0

  };


  studentReadings.forEach(
    item => {

      if(
        answerCounts[item.answer]
        !==
        undefined
      ){

        answerCounts[
          item.answer
        ]++;

      }

    }
  );


  let stableAnswer =
  "A";

  let highestCount =
  -1;


  Object.keys(
    answerCounts
  )
  .forEach(answer => {

    if(
      answerCounts[answer] >
      highestCount
    ){

      stableAnswer =
      answer;

      highestCount =
      answerCounts[answer];

    }

  });


  /*
    نثبت النتيجة
  */

  lockResult(
    bestID,
    stableAnswer
  );

}


/* =====================================
   تحديد اتجاه البطاقة
===================================== */

function getAnswerFromOrientation(
  corners
){

  if(
    !corners ||
    corners.length < 2
  ){

    return "?";

  }


  const p0 =
  corners[0];

  const p1 =
  corners[1];


  const dx =
  p1.x - p0.x;

  const dy =
  p1.y - p0.y;


  let angle =
  Math.atan2(
    dy,
    dx
  )
  *
  180
  /
  Math.PI;


  if(angle < 0){

    angle += 360;

  }


  if(
    angle >= 315 ||
    angle < 45
  ){

    return "A";

  }


  if(
    angle >= 45 &&
    angle < 135
  ){

    return "B";

  }


  if(
    angle >= 135 &&
    angle < 225
  ){

    return "C";

  }


  return "D";

}


/* =====================================
   تثبيت النتيجة
===================================== */

function lockResult(
  id,
  answer
){

  resultLocked =
  true;


  readings = [];


  const student =
  students[id] ||
  {

    code:
    "S" +
    String(
      id + 1
    ).padStart(
      2,
      "0"
    ),

    name:
    "طالب غير مسجل"

  };


  const result =
  document.getElementById(
    "result"
  );


  result.classList.add(
    "success"
  );


  let details = "";


  /*
    الحضور
  */

  if(
    currentMode ===
    "attendance"
  ){

    details =

    '<div class="answer">'
    +
    '✅ تم تسجيل الحضور'
    +
    '</div>';

  }


  /*
    الواجب أو المهمة
  */

  else{

    details =

    '<div class="answer">'
    +
    'الإجابة: '
    +
    answer
    +
    '</div>';

  }


  result.innerHTML =

  '<div class="studentName">'
  +
  student.name
  +
  '</div>'

  +

  '<div class="studentCode">'
  +
  student.code
  +
  '</div>'

  +

  details

  +

  '<div class="hint">'
  +
  'تم تثبيت القراءة'
  +
  '</div>';


  document
  .getElementById(
    "status"
  )
  .innerHTML =

  "✅ تم التعرف على "
  +
  student.code;


  /*
    نظهر زر قراءة طالب آخر
  */

  document
  .getElementById(
    "unlockBtn"
  )
  .style.display =
  "block";

}


/* =====================================
   السماح بقراءة طالب آخر
===================================== */

function unlockResult(){

  resultLocked =
  false;

  readings = [];

  lastSeenTime = 0;


  const result =
  document.getElementById(
    "result"
  );


  result.classList.remove(
    "success"
  );


  result.innerHTML =
  "جاهز لمسح بطاقة الطالب";


  document
  .getElementById(
    "status"
  )
  .innerHTML =
  "وجّه الكاميرا إلى البطاقة";


  document
  .getElementById(
    "unlockBtn"
  )
  .style.display =
  "none";

}


/* =====================================
   فحص المكتبة
===================================== */

window.addEventListener(
  "load",
  function(){

    const status =
    document.getElementById(
      "status"
    );


    if(
      typeof AR ===
      "undefined"
    ){

      status.innerHTML =
      "❌ لم يتم تحميل قارئ البطاقات";

      return;

    }


    if(!detector){

      status.innerHTML =
      "❌ تعذر تشغيل قارئ البطاقات";

      return;

    }


    status.innerHTML =
    "جاهز — اضغط «فتح الكاميرا»";

  }
);

</script>

</body>
</html>
