<html lang="ar" dir="rtl">

<meta charset="UTF-8">

content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover">

<script src="https://cdn.jsdelivr.net/gh/damianofalcioni/js-aruco2@master/src/aruco.js"></script>

<style>

*{box-sizing:border-box}

body{
 margin:0;
 padding:16px;
 font-family:Arial,sans-serif;
 background:#f4f6f9;
 color:#14233a;
 text-align:center;
}

h1{

 margin:18px 0 5px;

}

.school{
 color:#667085;
 font-size:18px;
 margin-bottom:18px;
}

.setup{
 max-width:700px;
 margin:auto;
 background:white;
 padding:15px;
 border-radius:20px;
 margin-bottom:15px;
}

label{
 display:block;
 text-align:right;
 font-weight:bold;
 margin:10px 4px 6px;
}

select,input{

 padding:14px;
 border:2px solid #d0d5dd;

}

.tabs{

}

.tab{

.tab.active{

#status{

}

.cameraBox{

}

.frame{

 left:7%;
 top:8%;
 border:4px solid white;
 border-radius:22px;
 pointer-events:none;
}

.guide{
 position:absolute;
 bottom:16px;

canvas{
 display:none;
}

.buttons{

 margin:15px auto;
}

.main{
 width:100%;

 margin-bottom:10px;
 border:0;
 border-radius:18px;
 color:white;

}

#startBtn{
 background:#159447;
}

#switchBtn{
 background:#19558e;
}

#nextBtn{
 background:#e58a00;
 display:none;
}

#resetAttendanceBtn{

 display:none;
}

#summary{

 margin:15px auto;
 background:white;
 border-radius:20px;

}

.bigNumber{

 color:#159447;
 font-weight:bold;
}

.resultCard{

}

.studentName{

}

.studentCode{

}

.answer{

 font-weight:bold;

}

.small{
 color:#667085;

}

#individualResult{
 display:none;

 margin:15px auto;
 background:#e4f7eb;
 border:3px solid #159447;

}

<body>

<div class="setup">

<select id="classSelect">

<option value="">

</option>

301

<option value="302">
302

<option value="303">
303
</option>

</select>


<div id="dateArea">

<label>
التاريخ
</label>

<input
id="attendanceDate"

style="display:none">

<div class="cameraBox">

id="video"
autoplay
muted

id="guide">

<div id="summaryTitle">

</div>


<div
class="bigNumber"
id="attendanceCount">

0

</div>

عدد الطلاب المسجل حضورهم

</div>


<div id="attendanceList">
</div>

</div>


<script>

/* =====================================
   عناصر الصفحة
===================================== */

const video =
document.getElementById("video");

const canvas =
document.getElementById("canvas");

const ctx =
canvas.getContext(
 "2d",
 {willReadFrequently:true}
);


/* =====================================
   متغيرات النظام
===================================== */

let stream = null;

let detector = null;

let scanning = false;

let facingMode =
"environment";

let currentMode =
"attendance";


/* الحضور الجماعي */

let attendanceStudents = {};


/* المسح الفردي */

let individualReadings = [];

let individualLocked =
false;


/* تثبيت القراءة */

const REQUIRED_READINGS =
6;

const READING_WINDOW =
1000;


/* =====================================
   بيانات الطلاب

   Marker ID 0 = S01
   Marker ID 1 = S02
   Marker ID 2 = S03
   وهكذا
===================================== */

const students = {

0:{
 code:"S01",
 name:"اسم الطالب الأول"
},

1:{
 code:"S02",
 name:"اسم الطالب الثاني"
},

2:{
 code:"S03",
 name:"اسم الطالب الثالث"
},

3:{
 code:"S04",
 name:"اسم الطالب الرابع"
},

4:{
 code:"S05",
 name:"اسم الطالب الخامس"
},

5:{
 code:"S06",
 name:"اسم الطالب السادس"
},

6:{
 code:"S07",
 name:"اسم الطالب السابع"
},

7:{
 code:"S08",
 name:"اسم الطالب الثامن"
},

8:{
 code:"S09",
 name:"اسم الطالب التاسع"
},

9:{
 code:"S10",
 name:"اسم الطالب العاشر"
}

};


/* =====================================
   تشغيل قارئ البطاقات
===================================== */

try{

 detector =
 new AR.Detector();

}
catch(error){

 console.error(error);

}


/* =====================================
   وضع تاريخ اليوم تلقائيًا
===================================== */

function setToday(){

 const today =
 new Date();


 const year =
 today.getFullYear();


 const month =
 String(
  today.getMonth()+1
 ).padStart(
  2,
  "0"
 );


 const day =
 String(
  today.getDate()
 ).padStart(
  2,
  "0"
 );


 document
 .getElementById(
  "attendanceDate"
 )
 .value =
 year +
 "-" +
 month +
 "-" +
 day;

}

setToday();


/* =====================================
   اختيار نوع التسجيل
===================================== */

function selectMode(
 mode,
 button
){

 currentMode =
 mode;


 document
 .querySelectorAll(
  ".tab"
 )
 .forEach(
  btn => {

   btn.classList.remove(
    "active"
   );

  }
 );


 button.classList.add(
  "active"
 );


 const dateArea =
 document.getElementById(
  "dateArea"
 );


 const numberArea =
 document.getElementById(
  "numberArea"
 );


 const numberLabel =
 document.getElementById(
  "numberLabel"
 );


 const guide =
 document.getElementById(
  "guide"
 );


 const summary =
 document.getElementById(
  "summary"
 );


 /* الحضور */

 if(
  mode ===
  "attendance"
 ){

  dateArea.style.display =
  "block";


  numberArea.style.display =
  "none";


  summary.style.display =
  "block";


  guide.innerHTML =
  "الحضور: ارفع عدة بطاقات معًا أمام الكاميرا";

 }


 /* الواجب */

 else if(
  mode ===
  "homework"
 ){

  dateArea.style.display =
  "none";


  numberArea.style.display =
  "block";


  numberLabel.innerHTML =
  "رقم الواجب";


  summary.style.display =
  "none";


  guide.innerHTML =
  "الواجب: امسح بطاقة طالب واحد";

 }


 /* المهمة الأدائية */

 else if(
  mode ===
  "task"
 ){

  dateArea.style.display =
  "none";


  numberArea.style.display =
  "block";


  numberLabel.innerHTML =
  "رقم المهمة الأدائية";


  summary.style.display =
  "none";


  guide.innerHTML =
  "المهمة الأدائية: امسح بطاقة طالب واحد";

 }


 /* المشاركة */

 else{

  dateArea.style.display =
  "block";


  numberArea.style.display =
  "none";


  summary.style.display =
  "none";


  guide.innerHTML =
  "المشاركة: امسح بطاقة طالب واحد";

 }


 nextStudent();

}


/* =====================================
   التحقق من اختيار البيانات
===================================== */

function validateSetup(){

 const className =
 document
 .getElementById(
  "classSelect"
 )
 .value;


 if(!className){

  alert(
   "اختر الشعبة أولاً"
  );

  return false;

 }


 if(
  currentMode ===
  "homework"
  ||
  currentMode ===
  "task"
 ){

  const number =
  document
  .getElementById(
   "activityNumber"
  )
  .value;


  if(!number){

   if(
    currentMode ===
    "homework"
   ){

    alert(
     "أدخل رقم الواجب"
    );

   }

   else{

    alert(
     "أدخل رقم المهمة الأدائية"
    );

   }


   return false;

  }

 }


 return true;

}


/* =====================================
   تشغيل الكاميرا
===================================== */

async function startCamera(){

 if(
  !validateSetup()
 ){

  return;

 }


 const status =
 document.getElementById(
  "status"
 );


 try{


  if(
   !navigator.mediaDevices
   ||
   !navigator.mediaDevices.getUserMedia
  ){

   status.innerHTML =
   "❌ المتصفح لا يدعم الكاميرا";

   return;

  }


  if(stream){

   stream
   .getTracks()
   .forEach(
    track => {

     track.stop();

    }
   );

  }


  status.innerHTML =
  "جاري تشغيل الكاميرا...";


  stream =
  await navigator
  .mediaDevices
  .getUserMedia({

   video:{

    facingMode:{
     ideal:facingMode
    },

    width:{
     ideal:1280
    },

    height:{
     ideal:720
    }

   },

   audio:false

  });


  video.srcObject =
  stream;


  await video.play();


  status.innerHTML =
  "✅ الكاميرا تعمل";


  if(
   currentMode ===
   "attendance"
  ){

   document
   .getElementById(
    "resetAttendanceBtn"
   )
   .style.display =
   "block";

  }


  if(!scanning){

   scanning =
   true;


   requestAnimationFrame(
    scanFrame
   );

  }

 }
 catch(error){

  console.error(
   error
  );


  status.innerHTML =
  "❌ تعذر تشغيل الكاميرا: "
  +
  error.name;

 }

}


/* =====================================
   تبديل الكاميرا
===================================== */

async function switchCamera(){

 facingMode =
 facingMode ===
 "environment"
 ?
 "user"
 :
 "environment";


 await startCamera();

}


/* =====================================
   المسح المستمر
===================================== */

function scanFrame(){

 if(
  video.readyState >= 2
  &&
  detector
 ){

  const scanWidth =
  640;


  const ratio =
  video.videoHeight /
  video.videoWidth;


  const scanHeight =
  Math.max(
   1,
   Math.round(
    scanWidth *
    ratio
   )
  );


  canvas.width =
  scanWidth;


  canvas.height =
  scanHeight;


  ctx.drawImage(
   video,
   0,
   0,
   scanWidth,
   scanHeight
  );


  try{

   const imageData =
   ctx.getImageData(
    0,
    0,
    scanWidth,
    scanHeight
   );


   const markers =
   detector.detect(
    imageData
   );


   if(
    markers
    &&
    markers.length > 0
   ){

    /* =============================
       الحضور = مسح جماعي
    ============================== */

    if(
     currentMode ===
     "attendance"
    ){

     markers.forEach(
      marker => {

       registerAttendance(
        marker
       );

      }
     );

    }


    /* =============================
       الواجب / المهمة / المشاركة
       = مسح فردي
    ============================== */

    else if(
     !individualLocked
    ){

     collectIndividual(
      markers[0]
     );

    }

   }

  }
  catch(error){

   console.error(
    "Detection error:",
    error
   );

  }

 }


 requestAnimationFrame(
  scanFrame
 );

}


/* =====================================
   تسجيل الحضور الجماعي
===================================== */

function registerAttendance(
 marker
){

 const id =
 Number(
  marker.id
 );


 /*
   منع تكرار الطالب
 */

 if(
  attendanceStudents[id]
 ){

  return;

 }


 const student =
 getStudent(
  id
 );


 const className =
 document
 .getElementById(
  "classSelect"
 )
 .value;


 const date =
 document
 .getElementById(
  "attendanceDate"
 )
 .value;


 attendanceStudents[id] = {

  id:id,

  code:student.code,

  name:student.name,

  className:className,

  date:date,

  status:"حاضر"

 };


 updateAttendanceScreen();


 document
 .getElementById(
  "status"
 )
 .innerHTML =

 "✅ تم تسجيل "
 +
 student.code;

}


/* =====================================
   عرض قائمة الحضور
===================================== */

function updateAttendanceScreen(){

 const ids =
 Object.keys(
  attendanceStudents
 );


 document
 .getElementById(
  "attendanceCount"
 )
 .innerHTML =
 ids.length;


 const className =
 document
 .getElementById(
  "classSelect"
 )
 .value;


 const date =
 document
 .getElementById(
  "attendanceDate"
 )
 .value;


 document
 .getElementById(
  "summaryTitle"
 )
 .innerHTML =

 "الشعبة: "
 +
 className
 +
 "<br>"
 +
 "التاريخ: "
 +
 date;


 const list =
 document.getElementById(
  "attendanceList"
 );


 list.innerHTML =
 "";


 ids
 .sort(
  (a,b) =>
  Number(a) -
  Number(b)
 )
 .forEach(
  id => {

   const student =
   attendanceStudents[id];


   const card =
   document.createElement(
    "div"
   );


   card.className =
   "resultCard";


   card.innerHTML =

   '<div class="studentName">'
   +
   student.name
   +
   '</div>'

   +

   '<div class="studentCode">'
   +
   student.code
   +
   ' — حاضر ✅'
   +
   '</div>';


   list.appendChild(
    card
   );

  }
 );

}


/* =====================================
   بدء حضور جديد
===================================== */

function resetAttendance(){

 if(
  confirm(
   "هل تريد مسح قائمة الحضور الحالية وبدء حضور جديد؟"
  )
 ){

  attendanceStudents =
  {};


  updateAttendanceScreen();


  document
  .getElementById(
   "status"
  )
  .innerHTML =
  "جاهز لمسح الحضور";

 }

}


/* =====================================
   جمع قراءات الطالب الفردية
===================================== */

function collectIndividual(
 marker
){

 const now =
 Date.now();


 const id =
 Number(
  marker.id
 );


 const answer =
 getAnswer(
  marker.corners
 );


 individualReadings.push({

  id:id,

  answer:answer,

  time:now

 });


 individualReadings =
 individualReadings.filter(
  reading =>
  now -
  reading.time
  <=
  READING_WINDOW
 );


 /*
   نأخذ قراءات
   البطاقة نفسها فقط
 */

 const same =
 individualReadings.filter(
  reading =>
  reading.id === id
 );


 if(
  same.length <
  REQUIRED_READINGS
 ){

  document
  .getElementById(
   "status"
  )
  .innerHTML =
  "🔍 جاري تثبيت قراءة الطالب...";


  return;

 }


 /*
   نحدد أكثر اتجاه
   تكرر
 */

 const counts = {

  A:0,
  B:0,
  C:0,
  D:0

 };


 same.forEach(
  reading => {

   if(
    counts[
     reading.answer
    ]
    !==
    undefined
   ){

    counts[
     reading.answer
    ]++;

   }

  }
 );


 let bestAnswer =
 "A";


 let max =
 -1;


 Object.keys(
  counts
 )
 .forEach(
  answer => {

   if(
    counts[answer]
    >
    max
   ){

    max =
    counts[answer];


    bestAnswer =
    answer;

   }

  }
 );


 showIndividualResult(
  id,
  bestAnswer
 );

}


/* =====================================
   عرض نتيجة الفردي
===================================== */

function showIndividualResult(
 id,
 answer
){

 individualLocked =
 true;


 const student =
 getStudent(
  id
 );


 const className =
 document
 .getElementById(
  "classSelect"
 )
 .value;


 const activityNumber =
 document
 .getElementById(
  "activityNumber"
 )
 .value;


 const box =
 document
 .getElementById(
  "individualResult"
 );


 box.style.display =
 "block";


 let title =
 "";


 if(
  currentMode ===
  "homework"
 ){

  title =
  "📝 الواجب رقم "
  +
  activityNumber;

 }


 else if(
  currentMode ===
  "task"
 ){

  title =
  "📋 المهمة الأدائية رقم "
  +
  activityNumber;

 }


 else{

  title =
  "⭐ المشاركة";

 }


 box.innerHTML =

 '<div class="studentName">'
 +
 student.name
 +
 '</div>'

 +

 '<div class="studentCode">'
 +
 student.code
 +
 '</div>'

 +

 '<div class="small">'
 +
 'الشعبة: '
 +
 className
 +
 '</div>'

 +

 '<div style="margin-top:8px;font-weight:bold">'
 +
 title
 +
 '</div>'

 +

 '<div class="answer">'
 +
 'التقييم: '
 +
 answer
 +
 '</div>';


 document
 .getElementById(
  "status"
 )
 .innerHTML =

 "✅ تم تثبيت قراءة "
 +
 student.code;


 document
 .getElementById(
  "nextBtn"
 )
 .style.display =
 "block";

}


/* =====================================
   مسح الطالب التالي
===================================== */

function nextStudent(){

 individualLocked =
 false;


 individualReadings =
 [];


 const box =
 document.getElementById(
  "individualResult"
 );


 box.style.display =
 "none";


 box.innerHTML =
 "";


 document
 .getElementById(
  "nextBtn"
 )
 .style.display =
 "none";


 if(
  currentMode !==
  "attendance"
 ){

  document
  .getElementById(
   "status"
  )
  .innerHTML =
  "جاهز لمسح طالب";

 }

}


/* =====================================
   بيانات الطالب
===================================== */

function getStudent(
 id
){

 if(
  students[id]
 ){

  return students[id];

 }


 return {

  code:
  "S"
  +
  String(
   id+1
  )
  .padStart(
   2,
   "0"
  ),

  name:
  "طالب غير مسجل"

 };

}


/* =====================================
   تحديد اتجاه البطاقة
   A B C D
===================================== */

function getAnswer(
 corners
){

 if(
  !corners
  ||
  corners.length < 2
 ){

  return "?";

 }


 const p0 =
 corners[0];


 const p1 =
 corners[1];


 const dx =
 p1.x -
 p0.x;


 const dy =
 p1.y -
 p0.y;


 let angle =
 Math.atan2(
  dy,
  dx
 )
 *
 180
 /
 Math.PI;


 if(
  angle < 0
 ){

  angle +=
  360;

 }


 /*
   أعلى = A
   يمين = B
   أسفل = C
   يسار = D
 */


 if(
  angle >= 315
  ||
  angle < 45
 ){

  return "A";
