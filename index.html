function getStudent(id){

  const className =
  document.getElementById(
    "classSelect"
  ).value;

  const list =
  classStudents[className];

  if(
    !list ||
    !Number.isInteger(id) ||
    id < 0 ||
    id >= list.length
  ){
    return null;
  }

  return{

    id:id,

    code:
    "S" +
    String(id+1)
    .padStart(2,"0"),

    name:list[id],

    section:className

  };

}

   التعديل الجديد:

   يجب أن تظهر البطاقة 6 مرات صحيحة
   خلال نافذة زمنية قصيرة.

const ATTENDANCE_REQUIRED_HITS = 6;

const ATTENDANCE_HIT_WINDOW = 1800;


/*
   فلتر حجم وشكل البطاقة
*/

const MIN_MARKER_AREA = 1800;

const MAX_SIDE_RATIO = 2.2;


/* =========================================================
   فلتر هندسي للبطاقة
========================================================= */

function distanceBetween(a,b){

  const dx =
  a.x-b.x;

  const dy =
  a.y-b.y;

  return Math.sqrt(
    dx*dx +
    dy*dy
  );

}


function markerIsGood(marker){

  if(
    !marker ||
    !marker.corners ||
    marker.corners.length !== 4
  ){
    return false;
  }


  const c =
  marker.corners;


  const sides = [

    distanceBetween(
      c[0],
      c[1]
    ),

    distanceBetween(
      c[1],
      c[2]
    ),

    distanceBetween(
      c[2],
      c[3]
    ),

    distanceBetween(
      c[3],
      c[0]
    )

  ];


  const minSide =
  Math.min(...sides);

  const maxSide =
  Math.max(...sides);


  if(
    minSide <= 0
  ){
    return false;
  }


  /*
    البطاقة يجب ألا تكون
    مشوهة بشكل مبالغ فيه
  */

  if(
    maxSide/minSide >
    MAX_SIDE_RATIO
  ){
    return false;
  }


  /*
    حساب مساحة البطاقة
  */

  let area = 0;

  for(
    let i=0;
    i<4;
    i++
  ){

    const j =
    (i+1)%4;

    area +=
    c[i].x*c[j].y
    -
    c[j].x*c[i].y;

  }


  area =
  Math.abs(area)/2;


  /*
    استبعاد العلامات الصغيرة
    التي تظهر من تفاصيل الصورة
  */

  if(
    area <
    MIN_MARKER_AREA
  ){
    return false;
  }


  return true;

}

  ){

/* =========================================================
   التحقق
========================================================= */

function validateSetup(){

  const className =
  document
  .getElementById(
    "classSelect"
  )
  .value;


  if(!className){

    alert(
      "اختر الشعبة أولاً"
    );

    return false;

  }


  if(
    currentMode === "homework" ||
    currentMode === "task"
  ){

    const number =
    document
    .getElementById(
      "activityNumber"
    )
    .value;


    if(!number){

      if(
        currentMode ===
        "homework"
      ){

        alert(
          "أدخل رقم الواجب"
        );

      }

      else{

        alert(
          "أدخل رقم المهمة الأدائية"
        );

      }

      return false;

    }

  }


  return true;

}


/* =========================================================
   فتح الكاميرا
========================================================= */

async function startCamera(){

  if(
    !validateSetup()
  ){
    return;
  }


  const status =
  document.getElementById(
    "status"
  );


  try{

    if(
      !navigator.mediaDevices ||
      !navigator.mediaDevices
      .getUserMedia
    ){

      status.innerHTML =
      "❌ المتصفح لا يدعم الكاميرا";

      return;

    }


    if(stream){

      stream
      .getTracks()
      .forEach(track=>{

        track.stop();

      });

    }


    status.innerHTML =
    "جاري تشغيل الكاميرا...";


    stream =
    await navigator
    .mediaDevices
    .getUserMedia({

      video:{

        facingMode:{
          ideal:facingMode
        },

        width:{
          ideal:1920
        },

        height:{
          ideal:1080
        }

      },

      audio:false

    });


    video.srcObject =
    stream;

    await video.play();


    status.innerHTML =
    "✅ الكاميرا تعمل — وجّهها إلى البطاقات";


    if(
      currentMode ===
      "attendance"
    ){

      document
      .getElementById(
        "resetAttendanceBtn"
      )
      .style.display =
      "block";

    }


    if(!scanning){

      scanning = true;

      requestAnimationFrame(
        scanFrame
      );

    }

  }

  catch(error){

    console.error(error);

    status.innerHTML =
    "❌ تعذر تشغيل الكاميرا: "
    +
    error.name;

  }

}


/* =========================================================
   تبديل الكاميرا
========================================================= */

async function switchCamera(){

  facingMode =
  facingMode ===
  "environment"
  ?
  "user"
  :
  "environment";


  await startCamera();

}


/* =========================================================
   المسح المستمر
========================================================= */

function scanFrame(){

  if(
    video.readyState >= 2 &&
    detector
  ){

    const scanWidth =
    960;


    const ratio =
    video.videoHeight /
    video.videoWidth;


    const scanHeight =
    Math.max(
      1,
      Math.round(
        scanWidth*ratio
      )
    );


    canvas.width =
    scanWidth;

    canvas.height =
    scanHeight;


    ctx.drawImage(
      video,
      0,
      0,
      scanWidth,
      scanHeight
    );


    try{

      const imageData =
      ctx.getImageData(
        0,
        0,
        scanWidth,
        scanHeight
      );


      const detectedMarkers =
      detector.detect(
        imageData
      );


      /*
        فلترة القراءة:

        1- ID من 0 إلى 44
        2- الطالب موجود
        3- البطاقة بحجم وشكل مناسب
      */

      const validMarkers =
      detectedMarkers.filter(
        marker=>{

          const id =
          Number(marker.id);


          return(

            Number.isInteger(id)

            &&

            ALLOWED_MARKER_IDS
            .has(id)

            &&

            getStudent(id)

            &&

            markerIsGood(marker)

          );

        }
      );


      /*
        الحضور جماعي
      */

      if(
        currentMode ===
        "attendance"
      ){

        validMarkers
        .forEach(marker=>{

          collectAttendanceHit(
            marker
          );

        });


        cleanupAttendanceHits();

      }


      /*
        بقية الأوضاع فردية
      */

      else if(
        validMarkers.length > 0
        &&
        !individualLocked
      ){

        collectIndividual(
          validMarkers[0]
        );

      }

    }

    catch(error){

      console.error(
        "Detection error:",
        error
      );

    }

  }


  requestAnimationFrame(
    scanFrame
  );

}


/* =========================================================
   تجميع قراءات الحضور
========================================================= */

function collectAttendanceHit(
  marker
){

  const id =
  Number(marker.id);


  if(
    !ALLOWED_MARKER_IDS
    .has(id)
  ){
    return;
  }


  const student =
  getStudent(id);


  if(!student){
    return;
  }


  if(
    attendanceStudents[id]
  ){
    return;
  }


  if(
    !attendanceHits[id]
  ){

    attendanceHits[id] = [];

  }


  const now =
  Date.now();


  attendanceHits[id]
  .push(now);


  attendanceHits[id] =
  attendanceHits[id]
  .filter(
    time=>
    now-time
    <=
    ATTENDANCE_HIT_WINDOW
  );


  document
  .getElementById(
    "status"
  )
  .innerHTML =
  "🔍 "
  +
  student.code
  +
  " "
  +
  student.name
  +
  " — "
  +
  Math.min(
    attendanceHits[id].length,
    ATTENDANCE_REQUIRED_HITS
  )
  +
  "/"
  +
  ATTENDANCE_REQUIRED_HITS;


  if(
    attendanceHits[id].length
    >=
    ATTENDANCE_REQUIRED_HITS
  ){

    confirmAttendance(id);

  }

}


/* =========================================================
   اعتماد الحضور
========================================================= */

function confirmAttendance(id){

  if(
    attendanceStudents[id]
  ){
    return;
  }


  const student =
  getStudent(id);


  if(!student){
    return;
  }


  const className =
  document
  .getElementById(
    "classSelect"
  )
  .value;


  const date =
  document
  .getElementById(
    "attendanceDate"
  )
  .value;


  attendanceStudents[id] = {

    id:id,

    code:student.code,

    name:student.name,

    className:className,

    date:date,

    status:"حاضر"

  };


  attendanceHits[id] = [];


  updateAttendanceScreen();


  document
  .getElementById(
    "status"
  )
  .innerHTML =
  "✅ "
  +
  student.name
  +
  " — حاضر";

}


/* =========================================================
   تنظيف القراءات القديمة
========================================================= */

function cleanupAttendanceHits(){

  const now =
  Date.now();


  ALLOWED_MARKER_IDS
  .forEach(id=>{

    if(
      attendanceStudents[id]
    ){
      return;
    }


    if(
      !attendanceHits[id]
    ){

      attendanceHits[id] = [];

      return;

    }


    attendanceHits[id] =
    attendanceHits[id]
    .filter(
      time=>
      now-time
      <=
      ATTENDANCE_HIT_WINDOW
    );

  });

}


/* =========================================================
   ملخص الحضور
========================================================= */

function updateAttendanceScreen(){

  const ids =
  Object.keys(
    attendanceStudents
  );


  const className =
  document
  .getElementById(
    "classSelect"
  )
  .value;


  const listForClass =
  classStudents[className];


  const total =
  listForClass
  ?
  listForClass.length
  :
  STUDENT_COUNT;


  const present =
  ids.length;


  const absent =
  Math.max(
    0,
    total-present
  );


  document
  .getElementById(
    "attendanceCount"
  )
  .textContent =
  present;


  document
  .getElementById(
    "absentCount"
  )
  .textContent =
  absent;


  document
  .getElementById(
    "totalCount"
  )
  .textContent =
  total;


  const date =
  document
  .getElementById(
    "attendanceDate"
  )
  .value;


  if(className){

    document
    .getElementById(
      "summaryTitle"
    )
    .innerHTML =
    "<b>الشعبة "
    +
    className
    +
    "</b>"
    +
    "<br>"
    +
    date;

  }

  else{

    document
    .getElementById(
      "summaryTitle"
    )
    .innerHTML =
    "اختر الشعبة";

  }


  const list =
  document.getElementById(
    "attendanceList"
  );


  list.innerHTML = "";


  ids
  .sort(
    (a,b)=>
    Number(a)-Number(b)
  )
  .forEach(id=>{

    const student =
    attendanceStudents[id];


    const card =
    document.createElement(
      "div"
    );


    card.className =
    "resultCard";


    card.innerHTML =
    '<div class="studentName">'
    +
    student.name
    +
    '</div>'
    +
    '<div class="studentCode">'
    +
    student.code
    +
    ' — حاضر ✅'
    +
    '</div>';


    list.appendChild(card);

  });

}


/* =========================================================
   حضور جديد
========================================================= */

function resetAttendance(){

  if(
    confirm(
      "هل تريد مسح الحضور الحالي وبدء مسح جديد؟"
    )
  ){

    attendanceStudents = {};

    createAttendanceHits();

    updateAttendanceScreen();

    .getElementById(
      "status"
    )
    .innerHTML =

}


/* =========================================================
   القراءة الفردية
========================================================= */

function collectIndividual(
  marker
){

  const id =
  Number(marker.id);


  if(
    !ALLOWED_MARKER_IDS
    .has(id)
  ){
    return;
  }


  const student =
  getStudent(id);


  if(!student){
    return;
  }


  const now =
  Date.now();


  const answer =
  getAnswer(
    marker.corners
  );


  individualReadings.push({

    id:id,

    answer:answer,

    time:now

  });


  individualReadings =
  individualReadings
  .filter(
    reading=>
    now-reading.time
    <=
    READING_WINDOW
  );


  const same =
  individualReadings
  .filter(
    reading=>
    reading.id === id
  );


  if(
    same.length <
    REQUIRED_READINGS
  ){

    document
    .getElementById(
      "status"
    )
    .innerHTML =
    "🔍 جاري تثبيت "
    +
    student.name
    +
    "...";

    return;

  }


  const counts = {

    A:0,
    B:0,
    C:0,
    D:0

  };


  same.forEach(
    reading=>{

      if(
        counts[
          reading.answer
        ]
        !== undefined
      ){

        counts[
          reading.answer
        ]++;

      }

    }
  );


  let bestAnswer =
  "A";

  let max =
  -1;


  Object.keys(
    counts
  )
  .forEach(answer=>{

    if(
      counts[answer] > max
    ){

      max =
      counts[answer];

      bestAnswer =
      answer;

    }

  });


  showIndividualResult(
    id,
    bestAnswer
  );

}

/* =========================================================
   اتجاه البطاقة

   لا نغيره:

   A = A
   B = B
   C = C
   D = D
========================================================= */

function getAnswer(corners){

  if(
    !corners ||
    corners.length < 2
  ){
    return "?";
  }


  const p0 =
  corners[0];

  const p1 =
  corners[1];


  const dx =
  p1.x-p0.x;

  const dy =
  p1.y-p0.y;


  let angle =
  Math.atan2(
    dy,
    dx
  )
  *
  180
  /
  Math.PI;


  if(angle < 0){
    angle += 360;
  }


  /* A */

  if(
    angle >= 315 ||
    angle < 45
  ){
    return "A";
  }


  /* D */

  if(
    angle >= 45 &&
    angle < 135
  ){
    return "D";
  }


  /* C */

  if(
    angle >= 135 &&
    angle < 225
  ){
    return "C";
  }


  /* B */

  return "B";

}
