<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport"
        content="width=device-width,initial-scale=1,viewport-fit=cover">

  <title>اختبار الكاميرا</title>

  <style>
    body {
      margin: 0;
      padding: 25px;
      font-family: Arial, sans-serif;
      background: #f4f6f9;
      text-align: center;
    }

    h1 {
      color: #123f73;
    }

    button {
      width: 100%;
      max-width: 500px;
      padding: 18px;
      border: 0;
      border-radius: 15px;
      background: #16884b;
      color: white;
      font-size: 22px;
      font-weight: bold;
    }

    video {
      width: 100%;
      max-width: 600px;
      margin-top: 20px;
      border-radius: 18px;
      background: black;
    }

    #status {
      margin: 18px;
      font-size: 18px;
      font-weight: bold;
    }
  </style>
</head>

<body>

<h1>📷 اختبار كاميرا الطلاب</h1>

<div id="status">
اضغط الزر لتشغيل الكاميرا
</div>

<button onclick="startCamera()">
فتح الكاميرا
</button>

<br>

<video id="camera"
       autoplay
       playsinline
       muted>
</video>

<script>

async function startCamera() {

  const status = document.getElementById("status");
  const video = document.getElementById("camera");

  try {

    status.innerText = "جاري طلب إذن الكاميرا...";

    const stream =
      await navigator.mediaDevices.getUserMedia({
        video: {
          facingMode: {
            ideal: "environment"
          }
        },
        audio: false
      });

    video.srcObject = stream;

    status.innerText = "✅ الكاميرا تعمل";

  } catch (err) {

    status.innerText =
      "❌ " + err.name + " : " + err.message;

  }

}

</script>

</body>
</html>
